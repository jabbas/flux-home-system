---
# Static nameservers for Talos nodes: DNS must work on boot, before CoreDNS exists.
#
# 10.1.255.2 is AdGuard Home, NOT Unbound. Unbound sits behind it on 10.1.255.2:5335
# and only ever sees the local zones AdGuard forwards to it ([/home/] [/iot/] [/guest/]
# [/local/] [/jabbas.eu/]). Everything else -- docker.com included -- goes to AdGuard's
# 12 DNSCrypt upstreams. It is listed first so that *.home resolves; 1.1.1.1 is fallback.
#
# Debugging Docker Hub image pull failures (verified 2026-09-06): they come from a broken
# DNSCrypt upstream, not from a blocklist and not from Unbound. dnscrypt.pl returned
# NXDOMAIN for production.cloudfront.docker.com, a name that exists. Unbound queried
# directly on :5335 answers NOERROR. AdGuard blocking looks like NOERROR + A 0.0.0.0 +
# TTL 10 (blocking_mode: default), never NXDOMAIN, and check_host reports the name as
# NotFilteredNotFound. Because upstream_mode is parallel, upstreams race, so a single bad
# one shows up as random ~50% intermittent failures. Check the AdGuard querylog first.
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
    - address: 10.1.255.2
    - address: 1.1.1.1
