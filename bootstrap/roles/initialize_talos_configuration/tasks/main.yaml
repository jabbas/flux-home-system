---
# Cluster PKI (cluster CA, etcd CA, service account key) lives only on disk and is
# never committed. Generate it on a fresh clone; never overwrite an existing bundle,
# because that would break access to a running cluster.
- name: Generate Talos secrets bundle if missing
  connection: local
  ansible.builtin.command: "talosctl gen secrets --output-file {{ talos.secrets_path }}"
  args:
    creates: "{{ talos.secrets_path }}"

- name: Generate configuration using secrets.yaml
  connection: local
  ansible.builtin.shell: "talosctl gen config {{ talos.cluster_name }} {{ talos.endpoint }} --with-secrets {{ talos.secrets_path }} --with-examples=false --with-docs=false --install-disk {{ talos.boot_disk }} --install-image factory.talos.dev/metal-installer/{{ talos.schematic_id }}:v{{ talos.version }} --additional-sans {{ groups['all'] | join(',') }} --force"
  changed_when: false

- name: Authentik Pre-Shared Key File check
  connection: local
  ansible.builtin.stat:
    path: authentik.preshared.key
  register: authentik_preshared_key_check

- name: Generate Authentik Pre-Shared Key
  when:
    not authentik_preshared_key_check.stat.exists
  block:
    - name: Generate Authentik Pre-Shared Key
      connection: local
      ansible.builtin.shell: "openssl rand -hex 16"
      register: authentik_preshared_key
      changed_when: false

    - name: Save Authentik Pre-Shared Key to disk
      connection: local
      ansible.builtin.copy:
        content: "{{ authentik_preshared_key.stdout }}"
        dest: "authentik.preshared.key"
        mode: '0644'

- name: Update talosconfig with first endpoint
  connection: local
  ansible.builtin.shell: "talosctl --talosconfig talosconfig config endpoint {{ groups['all'][0] }}"
  changed_when: false

- name: Check if nodes is already provisioned
  block:
    - name: Get version
      ansible.builtin.shell: "talosctl --talosconfig talosconfig --nodes {{ item }} get version -o jsonpath='{.node}'"
      register: node_versions
      loop: "{{ groups['all'] }}"
      ignore_errors: true
      failed_when: false
      changed_when: false
    - name: Prepare the dict of already provisioned nodes
      set_fact:
        already_provisioned_nodes: "{{ already_provisioned_nodes | default({}) | combine({ (item.item): (item.item == item.stdout) }) }}"
      loop: "{{ node_versions.results }}"

- name: Apply patches
  ansible.builtin.shell: |
    talosctl --talosconfig talosconfig --nodes {{ item }} apply {{ '--insecure' if not already_provisioned_nodes[item] else '' }} -f controlplane.yaml \
      -p @patch/allow-scheduling.yaml \
      -p @patch/remove-externallb-label.yaml \
      -p @patch/oidc.yaml \
      -p @patch/kube-apiserver-resources.yaml \
      -p @patch/ntp.yaml \
      -p @patch/nameservers.yaml \
      -p @patch/sysctls.yaml \
      -p @patch/registry-home.yaml
  loop: "{{ groups['all'] }}"
  changed_when: false

# This is a *transport* gate, nothing more: port 50000 is apid, which answers within
# seconds of boot and in maintenance mode too, so it says nothing about etcd being
# ready to bootstrap. Readiness is the retry loop below. What this buys us is a bound
# on the pathological case: talosctl's dial timeout is ~20 s per call, so if the node
# is gone, a bare retry loop would burn 30+ minutes of i/o timeouts before failing.
# Here a missing node fails in 10 minutes with an unambiguous message instead.
- name: Wait for the Talos API to answer on the first control plane node
  ansible.builtin.wait_for:
    host: "{{ groups['all'][0] }}"
    port: 50000
    timeout: 600

# The old guard asked "are all nodes unprovisioned?", which is the wrong question: after
# a failed run every node answers, so bootstrap was skipped and the playbook hung on the
# 6443 wait. Ask about the cluster instead. etcd reaches Running only once the cluster is
# bootstrapped; Preparing/Waiting means it is still sitting in the join loop.
# A non-zero rc covers both "node unreachable" and "no such service" (node still in
# maintenance mode) -- both mean "not bootstrapped", so neither may abort the play.
# The match is anchored to the STATE column on purpose: the EVENTS block replays the
# service's state history, so a bare "Running" substring would misread a crash-looping
# etcd as a healthy one.
- name: Check whether the cluster is already bootstrapped
  ansible.builtin.command: "talosctl --talosconfig talosconfig --nodes {{ groups['all'][0] }} service etcd"
  register: initialize_talos_configuration_etcd
  changed_when: false
  failed_when: false

- name: Record whether the cluster is already bootstrapped
  ansible.builtin.set_fact:
    initialize_talos_configuration_bootstrapped: "{{ initialize_talos_configuration_etcd.rc == 0 and initialize_talos_configuration_etcd.stdout is search('(?m)^STATE\\s+Running') }}"

# "FailedPrecondition: bootstrap is not available yet" is a transient state, not an error:
# etcd is still waiting for /var/lib, the ETCD volume, the cri service and time sync. The
# window measured here was ~20 s, but a slower disk or an Image Factory pull can stretch
# it, hence a 10 minute budget (30 x 20 s) rather than a single shot.
#
# A second bootstrap against a live cluster is treated as success, not failure, so a
# re-run can never fail on it. NOTE: the exact error string could not be verified against
# a live cluster (the nodes were destroyed), so this matches broadly; the etcd guard above
# is the primary protection and this is only a safety net for the window where etcd has
# already been bootstrapped but has not yet reached Running.
- name: Bootstrap etcd on the first node
  ansible.builtin.command: "talosctl --talosconfig talosconfig --nodes {{ groups['all'][0] }} bootstrap"
  register: initialize_talos_configuration_bootstrap
  until: >-
    initialize_talos_configuration_bootstrap.rc == 0
    or initialize_talos_configuration_bootstrap.stderr is search('AlreadyExists|etcd data directory is not empty')
  retries: 30
  delay: 20
  changed_when: initialize_talos_configuration_bootstrap.rc == 0
  failed_when: >-
    initialize_talos_configuration_bootstrap.rc != 0
    and not (initialize_talos_configuration_bootstrap.stderr is search('AlreadyExists|etcd data directory is not empty'))
  when: not initialize_talos_configuration_bootstrapped | bool

- name: Wait for Talos bootstrap to be completed (kubeapi is ready)
  ansible.builtin.wait_for:
    host: "{{ item }}"
    port: 6443
  loop: "{{ groups['all'] }}"
  timeout: 600

- name: Update talosconfig with endpoint
  connection: local
  ansible.builtin.shell: "talosctl --talosconfig talosconfig config endpoint {{ groups['all'] | join(' ') }}"
  changed_when: false

- name: Create \$HOME/.talos directory if it doesn't exist
  ansible.builtin.file:
    path: "$HOME/.talos"
    state: directory
    mode: '0750'

- name: Copy talosconfig to \$HOME/.talos/config
  connection: local
  ansible.builtin.copy:
    src: talosconfig
    dest: "$HOME/.talos/config"
    mode: '0644'

- name: Generate kubectl config
  connection: local
  ansible.builtin.shell: "talosctl --nodes {{ groups['all'][0] }} --endpoints {{ groups['all'][0] }} kubeconfig"
  changed_when: false

- name: Provision it with flux
  connection: local
  kubernetes.core.k8s:
    state: present
    src: "{{ item }}"
  loop: "{{ lookup('fileglob', playbook_dir + '/provision/*.yaml', wantlist=True) | sort }}"
