---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
# Łańcuch dependsOn w infrastructure.yaml ma 6 poziomów. Przy domyślnym
# --requeue-dependency=30s każdy poziom czeka do 30 s, więc nowa rewizja
# dochodziła do grafany i secretspec-operatora po ~2 min (pomiar 2026-11-02).
patches:
  - patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --requeue-dependency=5s
    target:
      kind: Deployment
      name: kustomize-controller
