---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tekton-release
  namespace: flux-system
spec:
  interval: 1m0s
  timeout: 10m0s
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/infrastructure/tekton/release
  dependsOn:
    - name: sources
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: tekton-operator
      namespace: tekton-operator

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tekton-config
  namespace: flux-system
spec:
  interval: 1m0s
  timeout: 10m0s
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/infrastructure/tekton/config
  dependsOn:
    - name: tekton-release
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: tekton-pipelines-controller
      namespace: tekton-pipelines
    - apiVersion: apps/v1
      kind: Deployment
      name: tekton-triggers-controller
      namespace: tekton-pipelines
    - apiVersion: apps/v1
      kind: Deployment
      name: tekton-dashboard
      namespace: tekton-pipelines

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tekton-ci
  namespace: flux-system
spec:
  interval: 1m0s
  timeout: 5m0s
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/infrastructure/tekton/ci
  dependsOn:
    - name: tekton-config
    - name: sealed-secrets
    - name: democratic-csi

# Ingress i Middleware Dashboardu sa celowo oddzielone od tekton-config.
# Zyja w namespace "tekton-pipelines", ktory tworzy dopiero operator Tektona
# po zreconcilowaniu CR-a TektonConfig. Trzymane razem z config.yaml
# blokuja bootstrap swiezego klastra: Flux aplikuje caly zestaw naraz, Ingress
# wywala sie na braku namespace, apply jest przerywany i TektonConfig nigdy
# nie powstaje. tekton-config ma healthChecks na Deploymentach w tym
# namespace, wiec tutaj namespace na pewno juz istnieje.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tekton-dashboard
  namespace: flux-system
spec:
  interval: 1m0s
  timeout: 5m0s
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/infrastructure/tekton/dashboard
  dependsOn:
    - name: tekton-config
