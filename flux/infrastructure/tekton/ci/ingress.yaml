---
# Publiczne wystawienie EventListenera. TLS terminuje Cloudflare,
# ruch wchodzi tunelem cloudflared do traefik-external (10.1.200.0),
# dlatego celowo BRAK spec.tls.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tekton-webhook
  namespace: ci
spec:
  ingressClassName: traefik-external
  rules:
    - host: tekton.jabbas.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: el-github
                port:
                  number: 8080
