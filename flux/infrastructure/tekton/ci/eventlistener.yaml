---
# Mapowanie pol z payloadu "push" GitHuba na parametry TriggerTemplate.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-push
  namespace: ci
spec:
  params:
    - name: repo-url
      value: $(body.repository.clone_url)
    - name: repo-name
      value: $(body.repository.name)
    - name: revision
      value: $(body.after)
---
# Mapowanie payloadu "push" tagu semver (refs/tags/X.Y.Z) na parametry
# TriggerTemplate release-from-repo. `extensions.version` ustawia nakladka CEL
# triggera github-tag (nazwa tagu bez `refs/tags/`).
#
# DLACZEGO `revision` = NAZWA TAGU, a nie `body.after`: dla tagu adnotowanego
# (recznego, `git tag -a`) `body.after` to SHA OBIEKTU TAGU, nie commita.
# Git resolver i krok clone (`git fetch origin "$REVISION"`) dzialaja z nazwa
# tagu niezaleznie od tego, czy tag jest lekki, czy adnotowany, i zawsze
# buduja commit, na ktory tag wskazuje.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-tag
  namespace: ci
spec:
  params:
    - name: repo-url
      value: $(body.repository.clone_url)
    - name: repo-name
      value: $(body.repository.name)
    - name: revision
      value: $(extensions.version)
    - name: version
      value: $(extensions.version)
---
# Mapowanie payloadu "pull_request" na parametry TriggerTemplate
# build-from-repo — ten sam PipelineRun CI co dla pushu na main, tylko
# `revision` = SHA glowy PR-a. Git resolver pobiera .tekton/pipeline.yaml
# z tego SHA (galaz PR-a jest w tym samym repo — fork odrzuca filtr CEL),
# a krok clone pobiera ten sam SHA (`git fetch --depth 1 origin <sha>`).
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-pull-request
  namespace: ci
spec:
  params:
    - name: repo-url
      value: $(body.repository.clone_url)
    - name: repo-name
      value: $(body.repository.name)
    - name: revision
      value: $(body.pull_request.head.sha)
---
# Szablon PipelineRunu. Sama definicja Pipeline'u NIE jest w tym repo —
# jest pobierana git resolverem z repozytorium aplikacji (.tekton/pipeline.yaml)
# z dokladnie tej rewizji, ktora przyszla w webhooku.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: build-from-repo
  namespace: ci
spec:
  params:
    - name: repo-url
      description: Adres HTTPS repozytorium (clone_url z payloadu)
    - name: repo-name
      description: Nazwa repozytorium — uzywana w nazwie PipelineRunu, SA i obrazu
    - name: revision
      description: SHA commita do zbudowania
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: build-$(tt.params.repo-name)-
        namespace: ci
      spec:
        taskRunTemplate:
          # SA per repozytorium — tworzone osobno, dopiero gdy repo istnieje.
          serviceAccountName: build-$(tt.params.repo-name)
        pipelineRef:
          resolver: git
          params:
            - name: url
              value: $(tt.params.repo-url)
            - name: revision
              value: $(tt.params.revision)
            - name: pathInRepo
              value: .tekton/pipeline.yaml
            # PAT do prywatnych repozytoriow. UWAGA: wartoscia jest NAZWA
            # sekretu w namespace ci (tam, gdzie powstaje PipelineRun), a nie
            # sam token. Klucz w sekrecie to domyslnie `token` (gitTokenKey).
            #
            # To JEDEN token read-only obejmujacy WSZYSTKIE repozytoria
            # wlasciciela na GitHubie i jest wspoldzielony celowo. Dodanie
            # nowego repozytorium do CI NIE wymaga wystawiania nowego tokenu
            # ani nowego sekretu — wystarczy wpis w allowliscie CEL nizej
            # oraz ServiceAccount `build-<repo>`.
            #
            # UWAGA NA LITEROWKI: git resolver po cichu ignoruje nieznane
            # parametry — zla nazwa (np. `gittoken`, `git-token`) nie da
            # zadnego bledu walidacji, tylko `clone error: authentication
            # required`, czyli komunikat nie do odroznienia od braku
            # konfiguracji albo od nieprawidlowego/wygaslego tokenu.
            - name: gitToken
              value: github-pat-readonly
        params:
          - name: repo-url
            value: $(tt.params.repo-url)
          - name: revision
            value: $(tt.params.revision)
          - name: image-prefix
            value: registry.home/$(tt.params.repo-name)
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                storageClassName: zfs-nfs-csi
                resources:
                  requests:
                    storage: 5Gi
---
# Szablon PipelineRunu WYDANIA (tag semver X.Y.Z). Kopia build-from-repo z
# roznicami: pipeline pobierany z .tekton/release.yaml (z rewizji = nazwy
# tagu), dodatkowe params `version` i `chart-repo`, dluzszy timeout.
# Kontrakt: docs/plans/2026-09-09-tekton-pipeline-contract.md, sekcja
# "Wydanie (release)".
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: release-from-repo
  namespace: ci
spec:
  params:
    - name: repo-url
      description: Adres HTTPS repozytorium (clone_url z payloadu)
    - name: repo-name
      description: Nazwa repozytorium — uzywana w nazwie PipelineRunu, SA i obrazu
    - name: revision
      description: NAZWA TAGU (refs/tags/X -> X), nigdy body.after
    - name: version
      description: Wersja wydania X.Y.Z (= nazwa tagu)
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: release-$(tt.params.repo-name)-
        namespace: ci
      spec:
        # Suma timeoutow taskow .tekton/release.yaml (guard, clone, test,
        # buildy, publish-chart) przekracza domyslna godzine.
        timeouts:
          pipeline: 1h30m
        taskRunTemplate:
          serviceAccountName: build-$(tt.params.repo-name)
        pipelineRef:
          resolver: git
          params:
            - name: url
              value: $(tt.params.repo-url)
            - name: revision
              value: $(tt.params.revision)
            - name: pathInRepo
              value: .tekton/release.yaml
            # Nazwa sekretu w ns ci, nie token — patrz uwagi w build-from-repo.
            - name: gitToken
              value: github-pat-readonly
        params:
          - name: repo-url
            value: $(tt.params.repo-url)
          - name: revision
            value: $(tt.params.revision)
          - name: version
            value: $(tt.params.version)
          - name: image-prefix
            value: registry.home/$(tt.params.repo-name)
          - name: chart-repo
            value: registry.home/charts
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                storageClassName: zfs-nfs-csi
                resources:
                  requests:
                    storage: 5Gi
---
# Publiczny punkt wejscia dla webhooka GitHuba (tekton.jabbas.eu).
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: github
  namespace: ci
spec:
  serviceAccountName: tekton-triggers-sa
  triggers:
    - name: github-push
      interceptors:
        # 1) Weryfikacja HMAC (X-Hub-Signature-256) — odrzuca wszystko,
        #    co nie zostalo podpisane sekretem webhooka.
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: tekton-github-webhook
                secretKey: secretToken
            - name: eventTypes
              value:
                - push
        # 2) Allowlista repozytoriow + tylko galaz main.
        #
        # Pull requesty obsluguje osobny trigger github-pull-request nizej
        # (z obowiazkowym odrzuceniem forkow).
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                body.repository.full_name in ['jabbas/homebudget'] &&
                body.ref == 'refs/heads/main'
      bindings:
        - ref: github-push
      template:
        ref: build-from-repo
    # CI dla pull requestow: otwarcie, nowy commit w PR-ze, ponowne otwarcie.
    # Ten sam pipeline co push na main (.tekton/pipeline.yaml z SHA glowy
    # PR-a); wynik wraca na PR jako status commita `tekton/<pipeline>`
    # (Task github-commit-status). Webhook repo musi wysylac zdarzenia
    # `pull_request` (obok `push`).
    - name: github-pull-request
      interceptors:
        # 1) Ta sama weryfikacja HMAC co w github-push.
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: tekton-github-webhook
                secretKey: secretToken
            - name: eventTypes
              value:
                - pull_request
        # 2) Allowlista repozytoriow + akcje, ktore zmieniaja testowany kod.
        #
        # UWAGA BEZPIECZENSTWA — warunek head.repo == repository jest
        # OBOWIAZKOWY: PR z forka wykonalby dowolny kod z
        # .tekton/pipeline.yaml (pobierany git resolverem z rewizji
        # atakujacego) na koncie build-<repo> z poswiadczeniami do pushu do
        # registry.home i tokenami GitHuba. Dla PR-a z usunietego forka
        # head.repo jest null — wyrazenie konczy sie bledem CEL, czyli
        # trigger NIE odpala.
        #
        # GRANICA ZAUFANIA (swiadomie zaakceptowana): nawet bez forkow
        # pipeline PR-a biegnie z NIEZRECENZOWANEJ galezi — kazdy, kto moze
        # wypchnac galaz do repo, uruchamia w ns ci dowolny kod, zanim
        # ktokolwiek przeczyta PR. Pod w ns ci moze podpiac KAZDY sekret z
        # tego namespace'u (RBAC konta nie ogranicza montowania sekretow),
        # m.in. registry-home-push, jabbas-ca, github-pat-readonly,
        # github-status-token. To jest do przyjecia tylko dla prywatnego
        # repo z jednym wlascicielem. Pisze tez aplikacja Renovate: jej
        # galezie moga zmieniac .tekton/pipeline.yaml (renovate.json
        # homebudgetu wlacza manager `tekton`). Gdy pojawi sie kolejna osoba
        # albo bot z prawem zapisu — wrocic do tej decyzji (np. osobny
        # namespace bez sekretow publikacji dla PR-ow albo uruchamianie
        # dopiero po etykiecie od wlasciciela).
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                body.repository.full_name in ['jabbas/homebudget'] &&
                body.action in ['opened', 'synchronize', 'reopened'] &&
                body.pull_request.head.repo.full_name == body.repository.full_name
      bindings:
        - ref: github-pull-request
      template:
        ref: build-from-repo
    # Wydanie: push tagu semver X.Y.Z (bez "v", bez prerelease) uruchamia
    # .tekton/release.yaml z repozytorium aplikacji.
    - name: github-tag
      interceptors:
        # 1) Ta sama weryfikacja HMAC co w github-push.
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: tekton-github-webhook
                secretKey: secretToken
            - name: eventTypes
              value:
                - push
        # 2) Allowlista repozytoriow wydawanych + tylko tag X.Y.Z.
        #    `!body.deleted` odrzuca usuniecie tagu (GitHub wysyla wtedy
        #    "push" z deleted: true). Nakladka `version` = nazwa tagu.
        #    Dodanie wydan dla kolejnego repo = wpis w allowliscie ponizej.
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                body.repository.full_name in ['jabbas/homebudget'] &&
                body.ref.startsWith('refs/tags/') &&
                !body.deleted &&
                body.ref.split('/')[2].matches('^[0-9]+\\.[0-9]+\\.[0-9]+$')
            - name: overlays
              value:
                - key: version
                  expression: "body.ref.split('/')[2]"
      bindings:
        - ref: github-tag
      template:
        ref: release-from-repo
