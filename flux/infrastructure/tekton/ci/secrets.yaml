---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: registry-home-push
  namespace: ci
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: registry-home-push
      namespace: ci
    type: kubernetes.io/dockerconfigjson
---
# Sekret HMAC dla webhooka GitHuba (X-Hub-Signature-256).
# Ta sama wartosc musi byc wpisana w ustawieniach webhooka repozytorium na GitHubie.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tekton-github-webhook
  namespace: ci
spec:
  encryptedData:
    secretToken: 
  template:
    metadata:
      name: tekton-github-webhook
      namespace: ci
---
# GitHubowy PAT dla git resolvera — pobieranie .tekton/pipeline.yaml
# z prywatnych repozytoriow.
#
# To JEDEN token read-only obejmujacy WSZYSTKIE repozytoria wlasciciela,
# celowo wspoldzielony. Dodanie kolejnego repo do CI NIE wymaga nowego
# tokenu ani nowego sekretu — stad nazwa `readonly`, a nie nazwa repo.
#
# Klucz musi nazywac sie `token` (taka jest domyslna wartosc gitTokenKey).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: github-pat-readonly
  namespace: ci
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: github-pat-readonly
      namespace: ci
---
# GitHubowy PAT dla Taska github-commit-status — ustawianie statusow commitow
# (`tekton/<pipeline>` na PR-ach i na main).
#
# Fine-grained PAT, uprawnienie WYLACZNIE "Commit statuses: Read and write",
# ograniczony do wybranych repozytoriow (na start: jabbas/homebudget). Kolejne
# repo = dopisanie go do listy repozytoriow tego PAT-a na GitHubie, bez
# nowego sekretu. Osobny od github-pat-readonly, bo tamten jest read-only.
#
# Klucz `token`. Zrodlo: ~/.config/homebudget/github-status.token wlasciciela.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: github-status-token
  namespace: ci
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: github-status-token
      namespace: ci
