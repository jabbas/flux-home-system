---
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd-config
  namespace: ci
data:
  # Zaufanie do prywatnego CA (jabbas-ca) wyłącznie dla registry.home.
  # UWAGA: świadomie NIE podmieniamy systemowego bundla
  # /etc/ssl/certs/ca-certificates.crt — zamontowanie tam pojedynczego CA
  # przesłoniłoby wszystkie publiczne roots i zepsuło pull z ghcr.io,
  # docker.io itd. w sposób trudny do zdiagnozowania.
  #
  # Połączenie TLS do rejestru nawiązuje DEMON (buildkitd), więc CA musi
  # trafić tutaj. Poświadczenia do push idą odwrotną drogą — z klienta
  # (buildctl, przez DOCKER_CONFIG w kroku Tektona).
  buildkitd.toml: |
    [registry."registry.home"]
      ca = ["/etc/buildkit-certs/ca.crt"]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: ci
spec:
  replicas: 1
  strategy:
    # Cache leży w emptyDir na dysku węzła. Rolling update uruchomiłby drugi
    # buildkitd, który zająłby kolejne kilka GB ephemeral-storage na tym samym
    # węźle (ryzyko eviction / image GC), a i tak startowałby z pustym cache.
    # Zakładamy dokładnie jeden builder, więc najpierw ubijamy stary pod.
    type: Recreate
  selector:
    matchLabels:
      app: buildkitd
  template:
    metadata:
      labels:
        app: buildkitd
      annotations:
        # Wymusza restart poda po zmianie treści buildkitd.toml — bez tego
        # ConfigMap zaktualizowałby się w locie, ale demon czyta config
        # wyłącznie przy starcie.
        checksum/config: "registry-home-ca-v1"
    # UWAGA: brak ustawień AppArmor (ani przestarzałej adnotacji
    # container.apparmor.security.beta.kubernetes.io/*, ani appArmorProfile).
    # Węzły Talos nie mają AppArmor wśród aktywnych LSM
    # (/sys/kernel/security/lsm = lockdown,capability,yama,selinux,bpf,landlock),
    # więc jakikolwiek profil AppArmor byłby no-opem.
    spec:
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.33.0-rootless
          args:
            - --addr
            - tcp://0.0.0.0:1234
            - --oci-worker-no-process-sandbox
            # Ścieżkę configu podajemy JAWNIE. Domyślna wartość jest zależna
            # od kontekstu: buildkitd w user namespace (a rootless zawsze w nim
            # działa) szuka $HOME/.config/buildkit/buildkitd.toml, natomiast
            # `buildkitd --help` uruchomiony przez kubectl exec pokazuje
            # /etc/buildkit/buildkitd.toml. Bez --config config po cichu nie
            # zostałby wczytany.
            - --config
            - /etc/buildkit/buildkitd.toml
          env:
            # Demon nasłuchuje wyłącznie na TCP (--addr tcp://0.0.0.0:1234) i nie
            # tworzy gniazda unix. buildctl domyślnie łączy się przez
            # unix:///run/user/1000/buildkit/buildkitd.sock, którego tu nie ma,
            # więc bez BUILDKIT_HOST sondy exec zawsze kończyłyby się błędem.
            - name: BUILDKIT_HOST
              value: tcp://127.0.0.1:1234
          readinessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            # rootless buildkitd potrzebuje user namespaces — seccomp musi być
            # wyłączony, dlatego namespace ci ma PSA enforce: privileged
            seccompProfile:
              type: Unconfined
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - containerPort: 1234
              name: buildkit
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
              ephemeral-storage: 8Gi
            limits:
              memory: 4Gi
              ephemeral-storage: 10Gi
          volumeMounts:
            - name: cache
              mountPath: /home/user/.local/share/buildkit
            - name: config
              mountPath: /etc/buildkit
              readOnly: true
            # Osobny katalog, nie podkatalog /etc/buildkit — wolumen ConfigMap
            # jest read-only tmpfs i zagnieżdżanie w nim kolejnego montowania
            # jest niepotrzebnie kruche.
            - name: registry-ca
              mountPath: /etc/buildkit-certs
              readOnly: true
      volumes:
        - name: cache
          # Cache warstw musi leżeć na dysku węzła: rootless BuildKit robi
          # lchown przy rozpakowywaniu warstw, a NFS (zfs-nfs-csi) z sec=sys
          # odrzuca to jako EPERM. Konsekwencja: cache ginie przy restarcie
          # poda. Docelowo blokowy PVC przez democratic-csi iSCSI.
          emptyDir:
            sizeLimit: 8Gi
        - name: config
          configMap:
            name: buildkitd-config
        - name: registry-ca
          secret:
            # Sekret propagowany przez reflectora z namespace shared-secrets,
            # patrz flux/infrastructure/shared-secrets/jabbas-ca.yaml.
            secretName: jabbas-ca
            items:
              - key: ca.crt
                path: ca.crt

---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: ci
spec:
  selector:
    app: buildkitd
  ports:
    - port: 1234
      targetPort: 1234
      name: buildkit
