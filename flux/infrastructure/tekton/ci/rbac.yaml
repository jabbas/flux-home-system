---
# Konto uzywane przez sam EventListener (nie przez PipelineRuny).
# Potrzebuje czytac Triggery/Interceptory i tworzyc PipelineRuny w ns ci.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-triggers-sa
  namespace: ci
---
# Role namespace'owe: EventListener, TriggerBinding, TriggerTemplate, PipelineRun.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-triggers-eventlistener-binding
  namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-sa
    namespace: ci
---
# Role klastrowe: ClusterInterceptor / ClusterTriggerBinding (obiekty globalne).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-triggers-eventlistener-clusterbinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-sa
    namespace: ci
