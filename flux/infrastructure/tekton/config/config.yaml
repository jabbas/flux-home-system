---
apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  name: config
spec:
  # Nie ma stockowego profilu równego naszemu zakresowi: lite == same
  # Pipelines, basic == Pipelines + Triggers (bez Dashboardu). Bierzemy
  # więc all i odejmujemy nadmiar wyłącznikami poniżej.
  profile: all
  targetNamespace: tekton-pipelines
  pipeline:
    # Wymagane, by PipelineRun mógł pobrać definicję z .tekton/ repo aplikacji
    enable-git-resolver: true
  # W operatorze 0.81.1 profile: all instaluje także Chains, Results
  # (wraz ze StatefulSet postgres + PVC) oraz Pipelines as Code.
  # Te komponenty są poza zakresem tego wdrożenia — wyłączamy je jawnie,
  # zostawiając wyłącznie Pipelines + Triggers + Dashboard.
  chain:
    disabled: true
  result:
    disabled: true
    is_external_db: false
  platforms:
    kubernetes:
      pipelinesAsCode:
        enable: false
        # NIE USUWAĆ tego bloku settings, mimo że PAC jest wyłączony!
        # Operator 0.81.1 waliduje PACSettings BEZWARUNKOWO — także przy
        # enable: false. Webhook mutujący dodaje tylko options: {}, ale nie
        # inicjalizuje settings, więc getHubCatalogs
        # (pipelines-as-code v0.49.0, pkg/params/settings/default.go:21)
        # zapisuje do nil mapy i webhook walidujący PANIKUJE
        # ("assignment to entry in nil map"). Flux pokazuje to mylnie jako EOF,
        # a TektonConfig nie da się w ogóle utworzyć.
        # Objawia się wyłącznie przy świeżym CREATE (np. po odbudowie
        # klastra) — przy UPDATE istniejącego obiektu operator ma już
        # settings uzupełnione. Wystarczy JEDEN dowolny klucz, by mapa nie
        # była nil; poniżej domyślna wartość upstreamu, czyli semantycznie no-op.
        settings:
          hub-url: "https://api.hub.tekton.dev/v1"
  dashboard:
    # Dashboard ma pozostać włączony (wymagany przez design)
    readonly: false
  pruner:
    # Stary pruner oparty o CronJob — wyłączony na rzecz tektonpruner
    disabled: true
  tektonpruner:
    disabled: false
    global-config:
      enforcedConfigLevel: global
      ttlSecondsAfterFinished: 3600
      successfulHistoryLimit: 5
      failedHistoryLimit: 3
