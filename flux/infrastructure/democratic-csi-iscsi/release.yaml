---
# Second democratic-csi deployment, providing block storage over iSCSI.
#
# Deliberately kept in its own Flux Kustomization rather than alongside the NFS
# deployment. A failing HelmRelease here previously made the democratic-csi
# Kustomization unhealthy, which blocked cloudnativepg and tekton-ci through
# dependsOn. Nothing depends on this Kustomization, so storage experiments
# cannot take production down with them.
#
# Rationale for iSCSI at all: the NFS driver cannot provide correct POSIX file
# locking, which breaks mmap/flock-based embedded databases (LMDB, SQLite in WAL
# mode). Exposing ZFS zvols as iSCSI LUNs gives pods a real block device with a
# local ext4 filesystem, where locking behaves normally.
#
# Coexistence rules with the NFS deployment:
#   - csiDriver.name must be unique per cluster    -> org.democratic-csi.iscsi
#   - the ZFS parent dataset must not overlap      -> rpool/k8s-iscsi (vs rpool/k8s)
#   - iSCSI asset names are global on the target   -> namePrefix "csi-"
#
# Host-side prerequisites on pve.home (already done):
#   - targetcli-fb, python3-rtslib-fb, python3-configshell-fb installed
#   - rtslib-fb-targetctl.service enabled and active
#   - targetcli auto_save_on_exit=true (the driver never calls saveconfig, so
#     persistence of the LIO config depends entirely on this)
#   - datasets rpool/k8s-iscsi/v and rpool/k8s-iscsi/s created, compression=lz4
#   - zfs-import@rpool.service wired into zfs-import.target.wants, so the pool is
#     imported before LIO restores its config (otherwise every host reboot leaves
#     all LUNs missing). UNVALIDATED until the host is actually rebooted.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi-iscsi
  namespace: democratic-system
spec:
  chart:
    spec:
      chart: democratic-csi
      version: "0.15.1"
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
        namespace: flux-system
  interval: 1m0s
  # The node DaemonSet has to pull a ~300 MB image on three nodes before Helm's
  # readiness wait is satisfied. The chart's default 5m wait timed out on the
  # first attempt. Retry rather than stalling permanently on a transient issue.
  install:
    timeout: 10m0s
    remediation:
      retries: 2
  upgrade:
    timeout: 10m0s
    remediation:
      retries: 2
  values:
    csiDriver:
      # Must differ from org.democratic-csi.nfs used by the other release.
      name: "org.democratic-csi.iscsi"
      fsGroupPolicy: ReadWriteOnceWithFSType
      # iSCSI volumes are RWO and go through a real attach/detach cycle.
      attachRequired: true

    controller:
      driver:
        image:
          registry: ghcr.io/democratic-csi/democratic-csi
          # The chart defaults to "latest", which is not reproducible under Flux.
          tag: "v1.9.5"
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
      externalAttacher:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      externalProvisioner:
        extraArgs:
          - --extra-create-metadata
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      externalResizer:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      externalSnapshotter:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

    node:
      # Not required by the chroot strategy, but harmless and left on for
      # multipath/IPC paths.
      hostPID: true
      driver:
        image:
          registry: ghcr.io/democratic-csi/democratic-csi
          tag: "v1.9.5"
        # /usr/local/sbin/iscsiadm inside the image is NOT the real binary: it is
        # a bash wrapper shipped by democratic-csi (docker/iscsiadm) that decides
        # how to reach the host's iscsiadm. It supports exactly two strategies.
        #
        # "nsenter" CANNOT WORK ON TALOS. It resolves the daemon with
        # `pgrep --exact --oldest iscsid` and then enters that PID's mount and
        # network namespaces. On Talos v1.14, hostPID: true grants the sandboxd
        # PID namespace, not the true host one: /proc/1/comm is "sandboxd", only
        # Kubernetes-side processes are visible, and iscsid - which runs as a
        # Talos extension service in containerd namespace "system" - is absent.
        # The process is genuinely named "iscsid", so the pattern is not the
        # problem and no tuning helps. pgrep matches nothing and the wrapper
        # aborts with "failed to find iscsid pid for nsenter", failing
        # NodeStageVolume. Same symptom as democratic-csi#488, which was closed
        # without a resolution.
        #
        # "chroot" does no PID lookup at all: it runs
        # `chroot /host /usr/local/sbin/iscsiadm`, using the host root that the
        # chart already mounts at /host. That reaches the real ELF binary and the
        # host's /etc/iscsi database. It can talk to the daemon because
        # open-iscsi's control socket is the abstract AF_UNIX socket
        # @ISCSIADM_ABSTRACT_NAMESPACE, which is scoped to the network namespace
        # - and hostNetwork is already shared. Verified on all three nodes:
        # `chroot /host /usr/local/sbin/iscsiadm -m session` returns
        # "No active sessions" with exit 21, i.e. the daemon answered.
        #
        # chroot is also the wrapper's own built-in default.
        extraEnv:
          - name: ISCSIADM_HOST_STRATEGY
            value: chroot
          # Absolute path, so the wrapper takes its first branch and execs
          # /host/usr/local/sbin/iscsiadm directly. Without this it falls through
          # to `chroot /host /usr/bin/env ...`, which fails on Talos because the
          # host rootfs has no /usr/bin/env.
          - name: ISCSIADM_HOST_PATH
            value: /usr/local/sbin/iscsiadm
        # iscsiDirHostPath is deliberately left at the chart default (/etc/iscsi).
        # Do NOT set it to /usr/local/etc/iscsi: that path was removed in
        # iscsi-tools v0.2.0 and the node pods then fail trying to mkdir it on a
        # read-only filesystem. Every pre-2025 blog post still recommends it.
        #
        # The empty hostPathType below is the actual Talos fix. On Talos the
        # kubelet runs in its own mount namespace which does not contain
        # /etc/iscsi, so the default type "Directory" fails its check with
        # "hostPath type check failed ... path does not exist" and the pods never
        # start. The mount itself is performed by containerd in the HOST
        # namespace, so skipping the check still yields the real host directory.
        # Do not use DirectoryOrCreate: that type explicitly requires kubelet to
        # resolve the path and would try to create it inside kubelet's own
        # read-only root. Ref: siderolabs/talos discussion #9674.
        iscsiDirHostPathType: ""
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
      driverRegistrar:
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
      cleanup:
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi

    driver:
      config:
        # The chart reads this even when existingConfigSecret is set.
        driver: zfs-generic-iscsi
      existingConfigSecret: csi-zfs-pve-iscsi

    volumeSnapshotClasses:
      - name: democratic-csi-iscsi
        deletionPolicy: Delete
        parameters: {}

    storageClasses:
      - name: zfs-iscsi-csi
        # zfs-nfs-csi stays the cluster default.
        defaultClass: false
        reclaimPolicy: Delete
        # RWO block: do not attach the LUN until the consuming pod is scheduled,
        # otherwise the volume can be bound to a node that will not run it.
        volumeBindingMode: WaitForFirstConsumer
        allowVolumeExpansion: true
        parameters:
          # The local filesystem on top of the LUN. This is what restores proper
          # POSIX locking for LMDB/SQLite workloads.
          fsType: ext4
        mountOptions:
          - noatime
