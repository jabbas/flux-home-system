---
apiVersion: v1
kind: Namespace
metadata:
  name: secretspec-system
  labels:
    # The operator runs fully PSA `restricted` compliant (non-root, read-only
    # rootfs, seccomp RuntimeDefault, all capabilities dropped).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
