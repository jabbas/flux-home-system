---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: secretspec-operator
  namespace: secretspec-system
spec:
  interval: 30m
  releaseName: secretspec-operator

  # Chart from the cosign-verified OCIRepository (oci-repository.yaml).
  chartRef:
    kind: OCIRepository
    name: secretspec-operator

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    # Cluster mode: watch SecretSpecs in all namespaces (ClusterRole).
    watchNamespaces: []

    crds:
      # Chart renders the SecretSpec CRD ...
      install: true
      # ... and keeps it (with every SecretSpec) on uninstall.
      keep: true

    # Scraped by vmagent: the VictoriaMetrics operator converts ServiceMonitors
    # (prometheus converter enabled, vmagent selectAllByDefault) - no selector
    # labels needed. The CRD comes from prometheus-operator-crds in the
    # victoria-metrics Kustomization, hence dependsOn there.
    serviceMonitor:
      enabled: true
