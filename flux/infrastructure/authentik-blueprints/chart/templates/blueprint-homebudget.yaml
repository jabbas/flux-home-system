{{/*
  Ten plik istnieje WYŁĄCZNIE po to, żeby usunąć obiekty homebudget z
  Authentika (state: absent) — homebudget ma już własne logowanie i nie
  stoi za forwardAuth. Samo usunięcie pliku blueprintu NIE kasuje obiektów,
  które wcześniej utworzył (dokumentacja Authentika), dlatego sprzątanie
  idzie dwoma commitami: ten zamienia wpisy na state: absent, a następny —
  po sprawdzeniu w klastrze, że obiektów już nie ma — usuwa ten plik i jego
  wpis w blueprints.configMaps w flux/infrastructure/authentik/chart/values.yaml.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "authentik-blueprints.fullname" . }}-homebudget
  labels:
    {{- include "authentik-blueprints.componentLabels" (dict "context" . "component" "homebudget") | nindent 4 }}
data:
  homebudget.yaml: |
    version: 1
    metadata:
      name: Homebudget Proxy Setup
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # Aplikacja — usunięcie kaskadowo kasuje jej powiązanie z grupą.
      - model: authentik_core.application
        state: absent
        identifiers:
          slug: homebudget

      # Proxy provider forwardAuth (wypisany też z blueprint-outpost.yaml).
      - model: authentik_providers_proxy.proxyprovider
        state: absent
        identifiers:
          name: Homebudget Proxy

      # Grupa dostępu (usunięta też z values.groups i z użytkownika jabbas).
      - model: authentik_core.group
        state: absent
        identifiers:
          name: homebudget-users
