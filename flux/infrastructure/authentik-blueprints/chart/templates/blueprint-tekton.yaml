{{/*
  Dodajesz nowy proxy provider? Dwie rzeczy poza tym plikiem są obowiązkowe:
  1. dopisz providera do listy w blueprint-outpost.yaml (attrs.providers
     NADPISUJE listę — provider spoza niej nie działa w forwardAuth),
  2. zarejestruj tę ConfigMapę w blueprints.configMaps w
     flux/infrastructure/authentik/chart/values.yaml — worker montuje
     wyłącznie blueprinty z tej jawnej listy.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "authentik-blueprints.fullname" . }}-tekton
  labels:
    {{- include "authentik-blueprints.componentLabels" (dict "context" . "component" "tekton") | nindent 4 }}
data:
  tekton.yaml: |
    version: 1
    metadata:
      name: Tekton Dashboard Proxy Setup
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # Proxy provider for forwardAuth with Traefik
      - model: authentik_providers_proxy.proxyprovider
        id: tekton-provider
        identifiers:
          name: Tekton Proxy
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          external_host: https://tekton.dev.home
          mode: forward_single
          access_token_validity: hours=24

      # Application
      - model: authentik_core.application
        id: tekton-app
        identifiers:
          slug: tekton
        attrs:
          name: Tekton
          icon: {{ .Values.oidc.tekton.icon | quote }}
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Tekton Proxy"]]

      # Policy binding for access control
      - model: authentik_policies.policybinding
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, tekton]]
          group: !Find [authentik_core.group, [name, tekton-admins]]
        attrs:
          enabled: true
          negate: false
          timeout: 30
